# OASIS ECHO Configuration
# This file is sourced by the systemd service

# MQTT Settings
MQTT_HOST=localhost
MQTT_PORT=8883
# MQTT Authentication (required — set before starting)
#MQTT_USERNAME=echo
#MQTT_PASSWORD=

# MQTT TLS (set to 1 or true to enable)
MQTT_TLS=true
MQTT_CA_CERT=/etc/mosquitto/certs/ca.crt

# Serial Port
SERIAL_PORT=/dev/ttyUSB2
SERIAL_BAUD=115200

# Telemetry interval (seconds)
TELEMETRY_INTERVAL=10

# Rate limits (defense in depth — DAWN has its own UX limits)
RATE_LIMIT_CALLS_PER_HOUR=5
RATE_LIMIT_SMS_PER_HOUR=20
