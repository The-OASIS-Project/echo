# OASIS ECHO Configuration
# This file is sourced by the systemd service

# MQTT Settings
MQTT_HOST=localhost
MQTT_PORT=8883
# MQTT Authentication (required — set before starting)
#MQTT_USERNAME=echo
#MQTT_PASSWORD=

# MQTT TLS (set to 1 or true to enable)
MQTT_TLS=true
MQTT_CA_CERT=/etc/mosquitto/certs/ca.crt

# Serial Port (AT command interface — if04 on the SIM7600G-H).
# Prefer a stable /dev/serial/by-id/ alias over a raw /dev/ttyUSBn: raw numbers
# reshuffle whenever another USB-serial device is added/removed at boot. Find
# yours with:  ls -l /dev/serial/by-id/
# NOTE: the SIM7600 ships with SimTech's default USB serial (0123456789ABCDEF);
# if you ever attach a second same-serial device, use /dev/serial/by-path/ instead.
SERIAL_PORT=/dev/serial/by-id/usb-SimTech__Incorporated_SimTech__Incorporated_0123456789ABCDEF-if04-port0
SERIAL_BAUD=115200

# Telemetry interval (seconds)
TELEMETRY_INTERVAL=10

# Rate limits (defense in depth — DAWN has its own UX limits)
RATE_LIMIT_CALLS_PER_HOUR=5
RATE_LIMIT_SMS_PER_HOUR=20
